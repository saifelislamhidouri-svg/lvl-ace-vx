<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LVL UP — تسجيل الدخول</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Orbitron:wght@600;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="login-page">

<div class="particles">
  <div class="p"></div><div class="p"></div><div class="p"></div>
  <div class="p"></div><div class="p"></div><div class="p"></div>
  <div class="p"></div><div class="p"></div><div class="p"></div>
</div>

<div class="login-wrap">
  <div class="login-card">

    <div class="logo-block">
      <div class="logo-ring">
        <div class="logo-core">
          <span class="lvl">LVL</span>
          <span class="up">UP</span>
        </div>
      </div>
      <h1>LVL UP <span class="accent">MANAGER</span></h1>
      <p class="tag">⚡ Squad Auto Level-Up Web Panel</p>
      <p class="dev">by <b>@xCTx_AyOuB</b></p>
    </div>

    {% if error %}
    <div class="alert alert-error">{{ error }}</div>
    {% endif %}

    <form method="POST" class="form">
      <div class="field">
        <label>👤 اسم المستخدم</label>
        <input type="text" name="username" placeholder="@xCTx_AyOuB"
               autocomplete="username" required autofocus>
      </div>
      <div class="field">
        <label>🔒 كلمة السر</label>
        <input type="password" name="password" placeholder="••••••••••"
               autocomplete="current-password" required>
      </div>

      <button type="submit" class="btn-primary">
        <span>دخول</span>
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M5 12h14M13 6l6 6-6 6"
                stroke="currentColor" stroke-width="2.4"
                stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </form>

    <div class="footer-note">
      🔐 Private Panel — Authorized Users Only
    </div>
  </div>
</div>

</body>
</html>
